name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch official Baritone 1.21.1 NeoForge artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs baritone-artifact
          gh run download 33567841429 --repo cabaletta/baritone --name Artifacts --dir baritone-artifact
          find baritone-artifact -type f \( -name '*standalone-neoforge*.jar' -o -name '*api-neoforge*.jar' \) -exec cp {} libs/ \;
          test -n "$(find libs -type f -name '*.jar' -print -quit)"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: altoclef-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Package Altoclef and Baritone mods
        if: success()
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          cp libs/*.jar dist/

      - name: Upload mod bundle
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: altoclef-neoforge-1.21.1-bundle
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14
